name: pdf_merge
description: "PDF Merge & Viewer - Gabungkan dan baca banyak file PDF"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^9.2.2
  flutter_pdfview: ^1.4.1
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^11.0.0
  permission_handler: ^11.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
